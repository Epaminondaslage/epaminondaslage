name: generate pacman contribution graph

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman,galaga'

      - name: generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: pick game of the day (rotates Pac-Man / snake / Galaga daily)
        run: |
          case $(( $(date -u +%s) / 86400 % 3 )) in
            0) GAME=pacman-contribution-graph ;;
            1) GAME=github-contribution-grid-snake ;;
            2) GAME=galaga-contribution-graph ;;
          esac
          echo "game of the day: $GAME"
          ls dist
          cp "dist/$GAME.svg" dist/contribution-of-the-day.svg
          if [ -f "dist/$GAME-dark.svg" ]; then
            cp "dist/$GAME-dark.svg" dist/contribution-of-the-day-dark.svg
          else
            cp "dist/$GAME.svg" dist/contribution-of-the-day-dark.svg
          fi

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
