name: generate pacman contribution graph

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: pick game of the day (alternates Pac-Man / snake daily)
        run: |
          if [ $(( $(date -u +%s) / 86400 % 2 )) -eq 0 ]; then
            GAME=pacman-contribution-graph
          else
            GAME=github-contribution-grid-snake
          fi
          echo "game of the day: $GAME"
          cp "dist/$GAME.svg" dist/contribution-of-the-day.svg
          cp "dist/$GAME-dark.svg" dist/contribution-of-the-day-dark.svg

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
